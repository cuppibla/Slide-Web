<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Act 3 · 3-B — What Is MCP</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#4285F4;--red:#EA4335;--yellow:#FBBC04;--green:#34A853;--g800:#3C4043;--g600:#5F6368;--g200:#E8EAED;--g100:#F1F3F4;--g50:#F8F9FA;--white:#FFFFFF;--font:'Google Sans',system-ui,sans-serif;--mono:'Google Sans Mono',monospace}
body{font-family:var(--font);background:var(--white);color:var(--g800);overflow:hidden;width:1920px;height:1080px}
.deck{position:relative;width:1920px;height:1080px}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:80px 100px;background:var(--white)}
.slide.active{display:flex}
.slide-num{display:none}
.section-tag{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:16px}
h1{font-size:56px;font-weight:700;line-height:1.15;color:var(--g800);margin-bottom:24px}
h2{font-size:52px;font-weight:700;line-height:1.2;color:var(--g800);margin-bottom:20px}
h3{font-size:26px;font-weight:500;color:var(--g600);margin-bottom:20px}
p{font-size:24px;color:var(--g600);line-height:1.6}
.g-bar{display:flex;gap:0;height:6px;margin-bottom:48px;border-radius:3px;overflow:hidden}
.g-bar span{flex:1}.g-bar .b{background:var(--blue)}.g-bar .r{background:var(--red)}.g-bar .y{background:var(--yellow)}.g-bar .g{background:var(--green)}
.glass{background:rgba(255,255,255,0.55);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border:1px solid rgba(255,255,255,0.7);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.8);padding:32px 36px;position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,0.4) 0%,rgba(255,255,255,0) 60%);pointer-events:none}
.glass-blue{background:rgba(66,133,244,0.08);border:1px solid rgba(66,133,244,0.2)}
.glass-green{background:rgba(52,168,83,0.08);border:1px solid rgba(52,168,83,0.2)}
.glass-red{background:rgba(234,67,53,0.08);border:1px solid rgba(234,67,53,0.15)}
.glass-yellow{background:rgba(251,188,4,0.08);border:1px solid rgba(251,188,4,0.2)}
.row{display:flex;gap:32px;align-items:flex-start}
.pill{display:inline-block;padding:6px 16px;border-radius:20px;font-size:16px;font-weight:500;background:var(--g100);color:var(--g600)}

/* Three-node MCP diagram */
.mcp-flow{display:flex;align-items:center;justify-content:center}
.mcp-node{text-align:center;padding:32px 30px}
.mcp-icon{font-size:40px;margin-bottom:12px}
.mcp-title{font-size:26px;font-weight:700;margin-bottom:14px}
.mcp-chips{display:grid;grid-template-columns:1fr 1fr;gap:10px;justify-items:stretch}
.mcp-chip{font-size:16px;font-weight:500;padding:8px 12px;border-radius:999px;text-align:center;white-space:nowrap}
.mcp-link{display:flex;align-items:center;padding:0 14px}
</style>
</head>
<body>
<div class="deck">

<!-- SLIDE 3-B: WHAT IS MCP (30-second theory) -->
<div class="slide active" data-id="3B">
  <div class="g-bar"><span class="b"></span><span class="r"></span><span class="y"></span><span class="g"></span></div>

  <h2>MCP: One open standard for all data tools</h2>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:56px">
    <div class="mcp-flow">
      <div class="glass glass-blue mcp-node" style="width:430px">
        <div class="mcp-icon">🤖</div>
        <div class="mcp-title" style="color:var(--blue)">Any agent</div>
        <div class="mcp-chips">
          <span class="mcp-chip" style="background:rgba(66,133,244,0.14);color:var(--blue)">Antigravity 2.0</span>
          <span class="mcp-chip" style="background:rgba(66,133,244,0.14);color:var(--blue)">Antigravity CLI</span>
          <span class="mcp-chip" style="background:rgba(66,133,244,0.14);color:var(--blue)">Antigravity IDE</span>
          <span class="mcp-chip" style="background:rgba(66,133,244,0.14);color:var(--blue)">Claude Code</span>
          <span class="mcp-chip" style="background:rgba(66,133,244,0.14);color:var(--blue)">Codex</span>
          <span class="mcp-chip" style="background:rgba(66,133,244,0.14);color:var(--blue)">Cursor</span>
        </div>
      </div>
      <div class="mcp-link">
        <svg viewBox="0 0 110 26" width="110" height="26"><path d="M16,13 L94,13" stroke="#5F6368" stroke-width="2.5"/><path d="M18,5 L6,13 L18,21" fill="#5F6368"/><path d="M92,5 L104,13 L92,21" fill="#5F6368"/></svg>
      </div>
      <div class="glass glass-yellow mcp-node" style="width:350px">
        <div class="mcp-icon">🔌</div>
        <div class="mcp-title" style="color:#E37400">MCP server</div>
        <div style="font-family:var(--mono);font-size:17px;color:var(--g600)">Model Context Protocol</div>
      </div>
      <div class="mcp-link">
        <svg viewBox="0 0 110 26" width="110" height="26"><path d="M16,13 L94,13" stroke="#5F6368" stroke-width="2.5"/><path d="M18,5 L6,13 L18,21" fill="#5F6368"/><path d="M92,5 L104,13 L92,21" fill="#5F6368"/></svg>
      </div>
      <div class="glass glass-green mcp-node" style="width:430px">
        <div class="mcp-icon">📊</div>
        <div class="mcp-title" style="color:var(--green)">Your data systems</div>
        <div class="mcp-chips">
          <span class="mcp-chip" style="background:rgba(52,168,83,0.14);color:var(--green)">BigQuery</span>
          <span class="mcp-chip" style="background:rgba(52,168,83,0.14);color:var(--green)">Spark</span>
          <span class="mcp-chip" style="background:rgba(52,168,83,0.14);color:var(--green)">Cloud SQL</span>
          <span class="mcp-chip" style="background:rgba(52,168,83,0.14);color:var(--green)">Spanner</span>
        </div>
      </div>
    </div>

    <p style="text-align:center;font-size:27px;color:var(--g600)"><strong style="color:var(--g800)">Open standard.</strong> Write tools once. Every agent can use them.</p>
  </div>
  <div class="slide-num">3-B</div>
</div>

</div>
</body>
</html>
