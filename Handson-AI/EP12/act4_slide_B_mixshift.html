<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Act 4 · 4-B — Mix Shift</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#4285F4;--red:#EA4335;--yellow:#FBBC04;--green:#34A853;--g800:#3C4043;--g600:#5F6368;--g200:#E8EAED;--g100:#F1F3F4;--g50:#F8F9FA;--white:#FFFFFF;--font:'Google Sans',system-ui,sans-serif;--mono:'Google Sans Mono',monospace}
body{font-family:var(--font);background:var(--white);color:var(--g800);overflow:hidden;width:1920px;height:1080px}
.deck{position:relative;width:1920px;height:1080px}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:80px 100px;background:var(--white)}
.slide.active{display:flex}
.slide-num{position:absolute;bottom:40px;right:60px;font-size:16px;color:var(--g600);font-weight:500}
.section-tag{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:16px}
h1{font-size:56px;font-weight:700;line-height:1.15;color:var(--g800);margin-bottom:24px}
h2{font-size:42px;font-weight:700;line-height:1.2;color:var(--g800);margin-bottom:20px}
h3{font-size:26px;font-weight:500;color:var(--g600);margin-bottom:20px}
p{font-size:24px;color:var(--g600);line-height:1.6}
.g-bar{display:flex;gap:0;height:6px;margin-bottom:48px;border-radius:3px;overflow:hidden}
.g-bar span{flex:1}.g-bar .b{background:var(--blue)}.g-bar .r{background:var(--red)}.g-bar .y{background:var(--yellow)}.g-bar .g{background:var(--green)}
.glass{background:rgba(255,255,255,0.55);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border:1px solid rgba(255,255,255,0.7);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.8);padding:32px 36px;position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,0.4) 0%,rgba(255,255,255,0) 60%);pointer-events:none}
.glass-blue{background:rgba(66,133,244,0.08);border:1px solid rgba(66,133,244,0.2)}
.glass-green{background:rgba(52,168,83,0.08);border:1px solid rgba(52,168,83,0.2)}
.glass-red{background:rgba(234,67,53,0.08);border:1px solid rgba(234,67,53,0.15)}
.glass-yellow{background:rgba(251,188,4,0.08);border:1px solid rgba(251,188,4,0.2)}
.row{display:flex;gap:32px;align-items:flex-start}
.pill{display:inline-block;padding:6px 16px;border-radius:20px;font-size:16px;font-weight:500;background:var(--g100);color:var(--g600)}

/* Mix-shift chart */
.chart-card{flex:1;display:flex;flex-direction:column;padding:32px 44px}
.legend-row{display:flex;gap:18px;justify-content:flex-end;margin-bottom:6px}
.legend-chip{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;font-size:17px;font-weight:600}
.legend-swatch{width:26px;height:6px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<div class="deck">

<!-- SLIDE 4-B: MIX SHIFT — THE MISLEADING AVERAGE -->
<div class="slide active" data-id="4B">
  <div class="g-bar"><span class="b"></span><span class="r"></span><span class="y"></span><span class="g"></span></div>
  <div class="section-tag" style="color:#E37400">ACT 4 · CRACKING THE ANOMALY</div>
  <h2>The average lied. Nothing got worse.</h2>

  <div class="glass chart-card">
    <div class="legend-row">
      <span class="legend-chip" style="background:rgba(52,168,83,0.10);color:var(--green)"><span class="legend-swatch" style="background:#34A853"></span>Retail — existing</span>
      <span class="legend-chip" style="background:rgba(251,188,4,0.14);color:#E37400"><span class="legend-swatch" style="background:#FBBC04"></span>B2B — new segment</span>
      <span class="legend-chip" style="background:rgba(66,133,244,0.10);color:var(--blue)"><span class="legend-swatch" style="background:#4285F4"></span>Blended average</span>
    </div>
    <svg viewBox="0 0 1320 500" width="100%" style="flex:1" xmlns="http://www.w3.org/2000/svg">
      <!-- gridlines -->
      <line x1="90" y1="130" x2="1280" y2="130" stroke="#E8EAED" stroke-width="2"/>
      <line x1="90" y1="250" x2="1280" y2="250" stroke="#E8EAED" stroke-width="2"/>
      <line x1="90" y1="370" x2="1280" y2="370" stroke="#E8EAED" stroke-width="2"/>
      <text x="80" y="136" text-anchor="end" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#9AA0A6">$100</text>
      <text x="80" y="256" text-anchor="end" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#9AA0A6">$80</text>
      <text x="80" y="376" text-anchor="end" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#9AA0A6">$60</text>
      <line x1="90" y1="430" x2="1280" y2="430" stroke="#DADCE0" stroke-width="2"/>
      <!-- Retail: green, flat, healthy -->
      <polyline points="110,118 330,118 550,118 770,118 990,118 1210,118" fill="none" stroke="#34A853" stroke-width="5" stroke-linecap="round"/>
      <text x="1224" y="112" text-anchor="end" font-family="Google Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#34A853">steady</text>
      <!-- B2B: yellow, new, flat at lower AOV -->
      <polyline points="770,358 990,358 1210,358" fill="none" stroke="#FBBC04" stroke-width="5" stroke-linecap="round"/>
      <circle cx="770" cy="358" r="8" fill="#FBBC04"/>
      <text x="770" y="396" text-anchor="start" font-family="Google Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#E37400">B2B enters — steady too</text>
      <!-- Blended: blue, flat then dips in Jan -->
      <polyline points="110,124 330,124 550,124 770,124 990,124 1210,172" fill="none" stroke="#4285F4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="1210" cy="172" r="9" fill="#4285F4"/>
      <!-- the dip annotation -->
      <line x1="1210" y1="124" x2="1210" y2="166" stroke="#EA4335" stroke-width="2.5" stroke-dasharray="6 6"/>
      <text x="1232" y="156" text-anchor="start" font-family="Google Sans, system-ui, sans-serif" font-size="24" font-weight="700" fill="#EA4335">↓7%</text>
      <!-- month labels -->
      <text x="110" y="468" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="18" fill="#5F6368">Aug</text>
      <text x="330" y="468" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="18" fill="#5F6368">Sep</text>
      <text x="550" y="468" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="18" fill="#5F6368">Oct</text>
      <text x="770" y="468" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="18" fill="#5F6368">Nov</text>
      <text x="990" y="468" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="18" fill="#5F6368">Dec</text>
      <text x="1210" y="468" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#EA4335">Jan</text>
    </svg>
  </div>

  <p style="text-align:center;font-size:24px;margin-top:28px">A new lower-AOV segment pulls the blend down — every existing segment is healthy.<br><strong style="color:var(--g800)">Segment first, conclude second.</strong></p>
  <div class="slide-num">4-B</div>
</div>

</div>
</body>
</html>
