<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Act 7 · 7-A — The Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#4285F4;--red:#EA4335;--yellow:#FBBC04;--green:#34A853;--g800:#3C4043;--g600:#5F6368;--g200:#E8EAED;--g100:#F1F3F4;--g50:#F8F9FA;--white:#FFFFFF;--font:'Google Sans',system-ui,sans-serif;--mono:'Google Sans Mono',monospace}
body{font-family:var(--font);background:var(--white);color:var(--g800);overflow:hidden;width:1920px;height:1080px}
.deck{position:relative;width:1920px;height:1080px}
.slide{position:absolute;inset:0;display:none;flex-direction:column;padding:80px 100px;background:var(--white)}
.slide.active{display:flex}
.slide-num{position:absolute;bottom:40px;right:60px;font-size:16px;color:var(--g600);font-weight:500}
.section-tag{font-size:14px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:16px}
h1{font-size:56px;font-weight:700;line-height:1.15;color:var(--g800);margin-bottom:24px}
h2{font-size:42px;font-weight:700;line-height:1.2;color:var(--g800);margin-bottom:20px}
h3{font-size:26px;font-weight:500;color:var(--g600);margin-bottom:20px}
p{font-size:24px;color:var(--g600);line-height:1.6}
.g-bar{display:flex;gap:0;height:6px;margin-bottom:48px;border-radius:3px;overflow:hidden}
.g-bar span{flex:1}.g-bar .b{background:var(--blue)}.g-bar .r{background:var(--red)}.g-bar .y{background:var(--yellow)}.g-bar .g{background:var(--green)}
.glass{background:rgba(255,255,255,0.55);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);border:1px solid rgba(255,255,255,0.7);border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.06),inset 0 1px 0 rgba(255,255,255,0.8);padding:32px 36px;position:relative;overflow:hidden}
.glass::before{content:'';position:absolute;inset:0;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,0.4) 0%,rgba(255,255,255,0) 60%);pointer-events:none}
.glass-blue{background:rgba(66,133,244,0.08);border:1px solid rgba(66,133,244,0.2)}
.glass-green{background:rgba(52,168,83,0.08);border:1px solid rgba(52,168,83,0.2)}
.glass-red{background:rgba(234,67,53,0.08);border:1px solid rgba(234,67,53,0.15)}
.glass-yellow{background:rgba(251,188,4,0.08);border:1px solid rgba(251,188,4,0.2)}
.row{display:flex;gap:32px;align-items:flex-start}
.pill{display:inline-block;padding:6px 16px;border-radius:20px;font-size:16px;font-weight:500;background:var(--g100);color:var(--g600)}

/* Forecast */
.chart-card{flex:1;display:flex;flex-direction:column;padding:32px 44px}
.chart-title{font-family:var(--mono);font-size:19px;color:var(--g600);margin-bottom:8px}
.chip-row{display:flex;gap:20px;justify-content:center;margin-top:26px}
.fc-chip{display:inline-block;padding:12px 30px;border-radius:999px;font-size:20px;font-weight:600;background:rgba(66,133,244,0.10);color:var(--blue)}
.fc-warn{text-align:center;font-size:24px;font-weight:600;color:var(--red);margin-top:24px}
</style>
</head>
<body>
<div class="deck">

<!-- SLIDE 7-A: THE FORECAST — TRUST THE MATH -->
<div class="slide active" data-id="7A">
  <div class="g-bar"><span class="b"></span><span class="r"></span><span class="y"></span><span class="g"></span></div>
  <div class="section-tag">ACT 7 · DELIVER THE FORECAST</div>
  <h2>Trust the math. Question the assumptions.</h2>

  <div class="glass chart-card">
    <div class="chart-title">AOV history + AI.FORECAST projection · next quarter</div>
    <svg viewBox="0 0 1240 440" width="100%" style="flex:1" xmlns="http://www.w3.org/2000/svg">
      <!-- gridlines -->
      <line x1="50" y1="135" x2="1180" y2="135" stroke="#E8EAED" stroke-width="2"/>
      <line x1="50" y1="220" x2="1180" y2="220" stroke="#E8EAED" stroke-width="2"/>
      <line x1="50" y1="305" x2="1180" y2="305" stroke="#E8EAED" stroke-width="2"/>
      <text x="42" y="141" text-anchor="end" font-family="Google Sans, system-ui, sans-serif" font-size="16" fill="#9AA0A6">$100</text>
      <text x="42" y="226" text-anchor="end" font-family="Google Sans, system-ui, sans-serif" font-size="16" fill="#9AA0A6">$90</text>
      <text x="42" y="311" text-anchor="end" font-family="Google Sans, system-ui, sans-serif" font-size="16" fill="#9AA0A6">$80</text>
      <line x1="50" y1="380" x2="1180" y2="380" stroke="#DADCE0" stroke-width="2"/>
      <!-- widening confidence band -->
      <polygon points="720,194.5 850,177.5 980,156 1110,135 1110,288 980,258 850,228.5" fill="rgba(66,133,244,0.12)"/>
      <!-- today divider -->
      <line x1="720" y1="70" x2="720" y2="380" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="6 8"/>
      <text x="720" y="56" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#5F6368">today</text>
      <!-- history: solid -->
      <polyline points="70,135 200,126.5 330,135 460,143.5 590,135 720,194.5" fill="none" stroke="#4285F4" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>
      <!-- forecast: dashed -->
      <polyline points="720,194.5 850,203 980,207 1110,211.5" fill="none" stroke="#4285F4" stroke-width="5" stroke-dasharray="13 11" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="720" cy="194.5" r="8" fill="#4285F4"/>
      <!-- annotations -->
      <text x="380" y="105" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4285F4">history</text>
      <text x="955" y="110" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="18" font-weight="700" fill="#4285F4">zero-shot forecast</text>
      <text x="1110" y="316" text-anchor="end" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#5F6368">confidence interval — widening</text>
      <!-- month labels -->
      <text x="70" y="418" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#5F6368">Aug</text>
      <text x="200" y="418" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#5F6368">Sep</text>
      <text x="330" y="418" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#5F6368">Oct</text>
      <text x="460" y="418" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#5F6368">Nov</text>
      <text x="590" y="418" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#5F6368">Dec</text>
      <text x="720" y="418" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#5F6368">Jan</text>
      <text x="850" y="418" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#9AA0A6">Feb</text>
      <text x="980" y="418" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#9AA0A6">Mar</text>
      <text x="1110" y="418" text-anchor="middle" font-family="Google Sans, system-ui, sans-serif" font-size="17" fill="#9AA0A6">Apr</text>
    </svg>

    <div class="chip-row">
      <span class="fc-chip">TimesFM — a foundation model for time series</span>
      <span class="fc-chip">zero-shot: no training step</span>
    </div>
  </div>

  <div class="fc-warn">The model doesn't know the promo expires.</div>
  <div class="slide-num">7-A</div>
</div>

</div>
</body>
</html>
